<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'none'" />
  <title>CodePOS MX</title>
  <style>
    :root { color-scheme: light; --ink: #0d1b33; --muted: #5b6b85; --line: #dbe3ef; --blue: #2679f5; --bg: #f6f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px 24px; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    h1 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 12.5px; }
    label { display: block; margin: 0 0 4px; font-size: 11.5px; font-weight: 650; }
    input { width: 100%; margin: 0 0 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font: inherit; color: var(--ink); background: #fff; }
    input:focus { outline: 2px solid color-mix(in srgb, var(--blue) 35%, transparent); border-color: var(--blue); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    button { padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line); font: inherit; font-weight: 600; cursor: pointer; background: #fff; color: var(--ink); }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  </style>
</head>
<body>
  <form id="form" autocomplete="off">
    <h1 id="title"></h1>
    <p id="message"></p>
    <div id="fields"></div>
    <div class="actions">
      <button type="button" id="cancel">Cancelar</button>
      <button type="submit" class="primary" id="confirm"></button>
    </div>
  </form>
  <script src="prompt.js"></script>
</body>
</html>
